name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Laravel 6.x
          - php: '7.4'
            laravel: '6.*'
            testbench: '4.*'
            phpunit: '9.*'

          # Laravel 7.x
          - php: '7.4'
            laravel: '7.*'
            testbench: '5.*'
            phpunit: '9.*'

          # Laravel 8.x
          - php: '8.0'
            laravel: '8.*'
            testbench: '6.*'
            phpunit: '9.*'
          - php: '8.1'
            laravel: '8.*'
            testbench: '6.*'
            phpunit: '9.*'

          # Laravel 9.x
          - php: '8.1'
            laravel: '9.*'
            testbench: '7.*'
            phpunit: '9.*'
          - php: '8.2'
            laravel: '9.*'
            testbench: '7.*'
            phpunit: '9.*'

          # Laravel 10.x
          - php: '8.1'
            laravel: '10.*'
            testbench: '8.*'
            phpunit: '10.*'
          - php: '8.2'
            laravel: '10.*'
            testbench: '8.*'
            phpunit: '10.*'
          - php: '8.3'
            laravel: '10.*'
            testbench: '8.*'
            phpunit: '10.*'

          # Laravel 11.x
          - php: '8.2'
            laravel: '11.*'
            testbench: '9.*'
            phpunit: '10.*'
          - php: '8.3'
            laravel: '11.*'
            testbench: '9.*'
            phpunit: '10.*'
          - php: '8.4'
            laravel: '11.*'
            testbench: '9.*'
            phpunit: '11.*'

          # Laravel 12.x
          - php: '8.2'
            laravel: '12.*'
            testbench: '10.*'
            phpunit: '11.*'
          - php: '8.3'
            laravel: '12.*'
            testbench: '10.*'
            phpunit: '11.*'
          - php: '8.4'
            laravel: '12.*'
            testbench: '10.*'
            phpunit: '11.*'

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-composer-

      - name: Install dependencies
        run: |
          composer config audit.block-insecure false
          composer require "illuminate/support:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "phpunit/phpunit:${{ matrix.phpunit }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit
